name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm # keyed by package-lock.json
      - run: npm ci
      # Any TypeScript error fails the build (every package, tests, scripts, configs).
      - run: npm run typecheck
      # typescript-eslint with TYPE-CHECKED rules (no-floating-promises, no-unsafe-*).
      - run: npm run lint
      # Vitest, all three packages + fast-check properties; fails if shared/ coverage < 85 %.
      - run: npm run coverage
      - run: npm run build
      # Two real browsers against the real server.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
