<!doctype html>
<!-- Dev tool (Lab 5, M3): TWO independent clients — two WebSocket connections, two NetGames with
     their own prediction/interpolation — flying against each other on autopilot at 100 ms ±30 /
     2% drop, drawn side by side. Stepping and drawing are timer-driven (not requestAnimationFrame),
     so it records smoothly even in a background tab. Saves docs/lab-05/duel.gif via the dev server.
     http://localhost:5173/duel.html   (?record=0 to just watch) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FlyOrDie — duel</title>
    <script type="importmap">
      { "imports": { "@flyordie/shared/": "../shared/src/" } }
    </script>
    <style>
      body {
        margin: 0;
        background: #1a1712;
        color: #e8dcb5;
        font:
          14px system-ui,
          sans-serif;
      }
      .row {
        display: flex;
        gap: 8px;
        padding: 8px;
      }
      canvas {
        width: 640px;
        height: 360px;
        border: 2px solid #5c6a3c;
      }
      #status {
        padding: 0 8px;
      }
    </style>
  </head>
  <body>
    <div class="row"><canvas id="a"></canvas><canvas id="b"></canvas></div>
    <div id="status">connecting two clients…</div>
    <script type="module">
      import { Connection } from './src/net/connection.js';
      import { NetGame } from './src/net/netgame.js';
      import { findServer } from './src/net/server.js';
      import { drawWorld } from './src/render/draw.js';
      import { createBattlefield } from './src/render/battlefield.js';
      import { createSprites } from './src/render/sprites.js';
      import { createHud } from './src/render/hud.js';
      import { drawNetgraph } from './src/net/netgraph.js';
      import { loadImage, loadJson } from './src/assets/loader.js';
      import { staticUrl } from './src/assets/base.js';
      import { encodeGif } from './src/experiments/gif.js';
      import { botButtons } from '@flyordie/shared/bot.js';
      import { bounds } from '@flyordie/shared/sim/arena.js';
      import { DT, TICK_RATE } from '@flyordie/shared/net/protocol.js';

      const NETSIM = { lagMs: 100, jitterMs: 30, dropPct: 2 };
      const FPS = 10;
      const SECONDS = 12;
      const FW = 440;
      const FH = 248;
      const status = document.getElementById('status');

      const [sheet, atlas, arena] = await Promise.all([
        loadImage(staticUrl('assets/sprites/sheet.svg')),
        loadJson(staticUrl('assets/sprites/sheet.json')),
        loadJson(staticUrl('assets/arenas/classic.json')),
      ]);
      const sprites = createSprites(sheet, atlas);
      const server = await findServer();
      if (!server) throw new Error('start the server: npm run dev');

      async function client(canvasId, name) {
        const canvas = document.getElementById(canvasId);
        canvas.width = bounds.width;
        canvas.height = bounds.height;
        const conn = new Connection(server.wsUrl);
        conn.addEventListener('open', () =>
          conn.sendNow({ type: 'join', room: 'eu-1', name, codec: 'binary' }),
        );
        const welcome = new Promise((r) =>
          conn.addEventListener('welcome', (e) => r(e.detail), { once: true }),
        );
        conn.connect();
        const { playerId } = await welcome;
        conn.markReady();
        const net = new NetGame({ conn, codec: 'binary', bounds, selfPlayerId: playerId });
        conn.addEventListener('binary', (e) => net.receive(e.detail));
        conn.addEventListener('roster', (e) => net.setRoster(e.detail.players));
        conn.addEventListener('pong', (e) => (net.stats.rttMs = performance.now() - e.detail.t));
        conn.send({ type: 'netsim', ...NETSIM });
        let lastIn = 0;
        let lastOut = 0;
        setInterval(() => {
          conn.send({ type: 'ping', t: performance.now() });
          net.stats.bytesInPerS = (conn.bytesIn - lastIn) / 1024 / 0.5;
          net.stats.bytesOutPerS = (conn.bytesOut - lastOut) / 1024 / 0.5;
          lastIn = conn.bytesIn;
          lastOut = conn.bytesOut;
        }, 500);
        return {
          name,
          net,
          ctx: canvas.getContext('2d'),
          canvas,
          hud: createHud(net.bus, { playerId: () => net.selfShipId }),
          battlefield: createBattlefield(bounds.width, bounds.height, {
            terrain: arena.terrain,
            seed: arena.seed,
          }),
          last: performance.now(),
        };
      }
      const clients = [await client('a', 'Red'), await client('b', 'Blue')];

      // 30 Hz input/prediction steps on an absolute-target timer (like the server's tick).
      let step = 0;
      let next = performance.now();
      (function tick() {
        step++;
        for (const c of clients) {
          const me = c.net.me;
          const others = (c.net.latest?.entities ?? []).filter(
            (e) =>
              (e.kind === 'ship' && e.id !== c.net.selfShipId && !e.destroyed) ||
              e.kind === 'asteroid',
          );
          c.net.step(
            botButtons(
              me && { x: me.pos.x, y: me.pos.y, angle: me.angle },
              others,
              step + c.name.length * 11,
            ),
          );
          c.net.sample(performance.now());
        }
        next += 1000 / TICK_RATE;
        setTimeout(tick, Math.max(0, next - performance.now()));
      })();

      function draw(c) {
        const now = performance.now();
        const dt = Math.min(0.1, (now - c.last) / 1000);
        c.last = now;
        c.net.flushEvents(now);
        c.battlefield.draw(c.ctx, now / 1000, dt);
        drawWorld(c.ctx, c.net.renderWorld(now, dt), 1, now / 1000, sprites);
        const player = c.net.selfView();
        if (player)
          c.hud.draw(c.ctx, {
            stats: { fps: FPS, ups: TICK_RATE, frameTime: 1000 / FPS },
            player,
            ...bounds,
            room: 'Kyiv Dogfight',
            audio: { muted: true, state: 'n/a' },
          });
        drawNetgraph(c.ctx, c.net, { netsim: NETSIM, fps: FPS });
      }

      await new Promise((r) => setTimeout(r, 2500)); // first snapshots, clocks settle
      const record = new URLSearchParams(location.search).get('record') !== '0';
      const comp = document.createElement('canvas');
      comp.width = FW * 2 + 6;
      comp.height = FH;
      const g = comp.getContext('2d', { willReadFrequently: true });
      const frames = [];
      await new Promise((resolve) => {
        const timer = setInterval(() => {
          clients.forEach(draw);
          if (!record) return (status.textContent = 'watching (no recording)');
          g.fillStyle = '#1a1712';
          g.fillRect(0, 0, comp.width, comp.height);
          g.drawImage(clients[0].canvas, 0, 0, FW, FH);
          g.drawImage(clients[1].canvas, FW + 6, 0, FW, FH);
          frames.push(g.getImageData(0, 0, comp.width, comp.height));
          status.textContent = `recording ${frames.length}/${FPS * SECONDS}`;
          if (frames.length >= FPS * SECONDS) {
            clearInterval(timer);
            resolve();
          }
        }, 1000 / FPS);
      });
      status.textContent = 'encoding GIF…';
      await new Promise((r) => setTimeout(r, 30));
      const gif = encodeGif(frames, comp.width, comp.height, Math.round(100 / FPS));
      const res = await fetch('/__save/lab-05/duel.gif', { method: 'POST', body: gif });
      status.textContent = `${(gif.length / 1024 / 1024).toFixed(1)} MB — ${await res.text()}`;
      window.duelDone = true;
    </script>
  </body>
</html>
